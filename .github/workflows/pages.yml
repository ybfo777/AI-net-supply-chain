name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/beautiful-knuth-g9d7l9"]
  workflow_dispatch:

# 允许工作流读取仓库、写入 Pages、使用 OIDC 部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，不取消进行中的发布
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages（不存在则自动启用，源设为 GitHub Actions）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact（发布仓库根目录，index.html 即站点首页）
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
